# Vibecoding Project Tracker — backend settings.
# Secrets (the DB password) live in application-local.properties, which is git-ignored.
# Copy application-local.properties.example to application-local.properties and fill it in.
spring.config.import=optional:classpath:application-local.properties

spring.application.name=vibetracker
# Render (and most hosts) tell the app which port to use through $PORT.
server.port=${PORT:8080}

# --- Database (MariaDB on this laptop) ---
# When hosted, these are overridden by environment variables
# SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=jdbc:mariadb://localhost:3306/vibetracker
spring.datasource.username=vibetracker
spring.datasource.password=${DB_PASSWORD:}

# schema.sql creates the tables on start-up (safe to re-run). Hibernate does not
# change the schema itself: the SQL file is the single source of truth.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Keep API errors readable but don't leak stack traces to the browser.
server.error.include-message=always
server.error.include-stacktrace=never

# --- Accounts (12c) ---
# How long a login lasts, and whether the cookie needs HTTPS (turn on when hosted over HTTPS).
app.auth.session-days=7
app.auth.cookie-secure=false

# --- Showcase demo (M13) ---
# true = create the demo account and sample boards on start-up (reset on every restart)
# and show "Try the demo" on the login page. On by default only on the hosted server
# (APP_DEMO_ENABLED=true); set it in application-local.properties to try it locally.
app.demo.enabled=false
