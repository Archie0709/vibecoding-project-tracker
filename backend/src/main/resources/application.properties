# Vibecoding Project Tracker — backend settings.
# Secrets (the DB password) live in application-local.properties, which is git-ignored.
# Copy application-local.properties.example to application-local.properties and fill it in.
spring.config.import=optional:classpath:application-local.properties

spring.application.name=vibetracker
server.port=8080

# --- Database (MariaDB on this laptop) ---
spring.datasource.url=jdbc:mariadb://localhost:3306/vibetracker
spring.datasource.username=vibetracker
spring.datasource.password=${DB_PASSWORD:}

# schema.sql creates the tables on start-up (safe to re-run). Hibernate does not
# change the schema itself: the SQL file is the single source of truth.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Keep API errors readable but don't leak stack traces to the browser.
server.error.include-message=always
server.error.include-stacktrace=never
